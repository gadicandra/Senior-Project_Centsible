<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Centsible</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #fff; color: #171717; padding: 16px; box-sizing: border-box; }
  main { max-width: 22rem; text-align: center; }
  h1 { font-size: 1.25rem; }
  p { color: #525252; line-height: 1.5; }
  button { font: inherit; padding: .5rem 1rem; border-radius: .5rem; border: 0; background: #171717; color: #fff; }
  @media (prefers-color-scheme: dark) { body { background: #0a0a0a; color: #fafafa; } p { color: #a3a3a3; } button { background: #fafafa; color: #171717; } }
</style>
</head>
<body>
<main>
  <h1>Kamu sedang offline</h1>
  <p>Halaman ini belum pernah dibuka di perangkat ini. Buka Beranda atau Transaksi sekali saat online, setelah itu keduanya bisa dipakai tanpa internet.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
